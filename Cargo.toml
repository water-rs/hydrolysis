[workspace]
resolver = "2"

[package]
name = "hydrolysis"
version = "0.2.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis"
description = "GPU-required self-drawn backend for WaterUI"
keywords = ["ui", "graphics", "gpu", "waterui", "vello"]
categories = ["gui", "graphics"]

[dependencies]
waterui-core = "0.3.1"
waterui-assets = "0.1.1"
# Decodes the CLI-staged window icon (always written as 8-bit RGBA PNG).
png = "0.18"
waterui = { version = "0.4.0", default-features = false, features = ["gpu", "inspector"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nami = "0.11.0"
waterui-graphics = { version = "0.4.0", default-features = false, features = ["gpu"] }
shaderloom = "0.1.2"
# `font-collection` for the one `parley` collection this runner builds and
# installs into the environment; the faces come from the resource loader and
# the system source `parley/system` provides, so `system-fonts` is not needed.
waterui-text = { version = "0.4.0", features = ["font-collection"] }
waterui-icon = "0.3.1"
waterui-shape = { version = "0.1.1", default-features = false }
waterui-map = "0.1.1"
waterui-webview = "0.4.0"
waterui-layout = "0.3.1"
waterui-controls = "0.3.1"
waterui-form = "0.3.1"
waterui-backend-core = { version = "0.1.1", default-features = false, features = ["widgets", "gestures"] }
waterkit-clipboard = "0.1.1"
waterui-locale = "0.1.1"
vello = "0.9"
parley = { version = "0.11", default-features = false, features = ["system"] }
wgpu = "29.0.4"
lru = "0.18"
rayon = "1.12"
pollster = "1.0"
executor-core = { version = "0.7.1", features = ["std"] }
rustc-hash = "2.1.3"
unicode-segmentation = "1.13"
async-task = "4.7"
native-executor = "0.8.0"
winit = { version = "0.30", optional = true }
keyboard-types = { version = "0.8.3", default-features = false }
ui-events-winit = { version = "0.3.0", optional = true }
accesskit = { version = "0.25", optional = true }
waterui-inspector-protocol = "0.1.1"
accesskit_winit = { version = "0.34.0", optional = true }

[build-dependencies]
cfg_aliases = "0.2.2"
shaderloom = { version = "0.1.2", features = ["build"] }

# Termination signals for the windowed desktop runner. No windowing system
# delivers SIGINT/SIGTERM/SIGHUP (or the Windows console close events) to winit,
# so the runner installs its own handler on every desktop target it builds for.
[target.'cfg(any(unix, windows))'.dependencies]
ctrlc = { version = "3.5", features = ["termination"], optional = true }

# Explicit ProMotion opt-in on macOS: a CADisplayLink created from the winit
# window's NSView declares the 120Hz frame-rate demand (see
# platform/macos_display_link.rs). All of these are already in winit's own
# dependency graph.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
cookie = { version = "0.18", optional = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSAnimation",
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
objc2-core-graphics = { version = "0.3", optional = true, features = ["CGPath"] }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSHTTPCookie",
    "NSJSONSerialization",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSURLError",
    "NSURLRequest",
    "NSURLResponse",
] }
objc2-quartz-core = { version = "0.3", optional = true, features = [
    "CALayer",
    "CADisplayLink",
    "CAFrameRateRange",
    "CAMetalLayer",
    "CAShapeLayer",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKBackForwardList",
    "WKContentWorld",
    "WKFrameInfo",
    "WKSecurityOrigin",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Response",
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Node",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
# The renderer itself knows nothing about `Canvas`: it resolves to a
# `SceneView` before it reaches layout. The tests still author canvases, which
# is what keeps that resolution honest.
waterui-canvas = "0.1.2"
# The wayland examples need a widget theme; m3 is independently maintained.
hydrolysis-m3 = "0.2.1"
waterui-testing = "0.4.0"
waterui-navigation = "0.3.1"
jiff = { version = "0.2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
waterui = { version = "0.4.0", default-features = false, features = ["flow-markdown", "gpu"] }
base64 = "0.22"
executor-core = { version = "0.7.1", features = ["std", "async-executor"] }
tiny_http = "0.12"

# `WKWebView` is `MainThreadOnly` and libtest runs tests on worker threads, so
# the macOS real-engine suite owns its `main` and pumps the main run loop.
[[test]]
name = "real_engine_macos"
harness = false
required-features = ["webview-system", "winit"]

[features]
default = []
accessibility = ["dep:accesskit"]
testing = []
inspector-signals = ["waterui/inspector-signals"]
# The platform's own web engine, bridged as a native subview. Every other engine
# is a crate the application links and installs; this backend never names one.
webview-system = [
    "dep:block2",
    "dep:cookie",
    "dep:futures",
    "dep:objc2-web-kit",
    "dep:serde_json",
]
winit = [
    "accessibility",
    "dep:winit",
    "dep:ui-events-winit",
    "dep:accesskit_winit",
    "dep:ctrlc",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
]
web = ["accessibility", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[package.metadata.cargo-machete]
ignored = ["cfg_aliases", "shaderloom"]

# The WaterUI packages above come from crates.io, so this repository builds
# against the same released APIs its users get. The third-party pins below are
# the framework's own: the published framework crates were built with these
# forks, and dropping them here would run this repository's render tests
# through different code than the framework runs.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }

# `waterui-testing` depends on this backend, so a test graph that took it from
# the registry would link two `hydrolysis` copies and render through a
# different one than it builds. Redirect the registry copy at this crate.
hydrolysis = { path = "." }

# The registry `hydrolysis-m3` still reads the normalized `clip_radius` fields
# the waterui branch below removes; the companion branch migrated to the
# fixed-radius shapes this backend resolves. Drop this entry once a release
# carries the migration.
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "6f142c274ac0c303fcece7256cc9cda479a1f7a9" }

# `AccessibilityRole::Dialog` (water-rs/waterui#627) and
# `DrawContext::draw_shadow` (water-rs/waterui#628) are merged on the contract
# branch but not yet released; until releases land on crates.io the framework
# crates resolve from that rev. Every `waterui-*` member of that repository
# is pinned to the same revision so the graph carries exactly one copy of
# each — a registry crate beside its git twin would compile duplicate
# `View`/`Resolvable` types. Drop the entries and bump the requirements once
# the releases carry them.
waterui = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-str = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "cfa9e75833e589331bb693961f8c7b8a7f615de9" }

[workspace]
resolver = "2"

[package]
name = "hydrolysis"
version = "0.3.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis"
description = "GPU-required self-drawn backend for WaterUI"
keywords = ["ui", "graphics", "gpu", "waterui", "vello"]
categories = ["gui", "graphics"]

[dependencies]
waterui-core = "0.5.0"
waterui-assets = "0.5.0"
# Decodes the CLI-staged window icon (always written as 8-bit RGBA PNG).
png = "0.18"
waterui = { version = "0.5.0", default-features = false, features = ["gpu", "inspector"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nami = "=0.11.1"
waterui-graphics = { version = "0.5.0", default-features = false, features = ["gpu"] }
shaderloom = "0.1.2"
# `font-collection` for the one `parley` collection this runner builds and
# installs into the environment; the faces come from the resource loader and
# the system source `parley/system` provides, so `system-fonts` is not needed.
waterui-text = { version = "0.5.0", features = ["font-collection"] }
waterui-icon = "0.5.0"
waterui-shape = { version = "0.5.0", default-features = false }
waterui-map = "0.5.0"
waterui-webview = "0.5.0"
waterui-layout = "0.5.0"
waterui-controls = "0.5.0"
waterui-form = "0.5.0"
waterui-backend-core = { version = "0.5.0", default-features = false, features = ["widgets", "gestures"] }
waterkit-clipboard = "0.1.1"
waterui-locale = "0.5.0"
vello = "0.9"
# `complex-scripts` ships the ICU4X segmentation dictionaries (CJ plus the
# Southeast-Asian scripts) inside the one parley build: this runner owns the
# `LayoutContext`, and without them its word segmenter logs `No segmentation
# model for complex script` per CJK run on every layout pass.
parley = { version = "0.11", default-features = false, features = ["system", "complex-scripts"] }
wgpu = "29.0.4"
lru = "0.18"
rayon = "1.12"
pollster = "1.0"
executor-core = { version = "0.7.1", features = ["std"] }
rustc-hash = "2.1.3"
unicode-segmentation = "1.13"
async-task = "4.7"
native-executor = "0.8.0"
winit = { version = "0.30", optional = true }
keyboard-types = { version = "0.8.3", default-features = false }
ui-events-winit = { version = "0.3.0", optional = true }
accesskit = { version = "0.25", optional = true }
waterui-inspector-protocol = "0.5.0"
accesskit_winit = { version = "0.34.0", optional = true }

[build-dependencies]
cfg_aliases = "0.2.2"
shaderloom = { version = "0.1.2", features = ["build"] }

# Termination signals for the windowed desktop runner. No windowing system
# delivers SIGINT/SIGTERM/SIGHUP (or the Windows console close events) to winit,
# so the runner installs its own handler on every desktop target it builds for.
[target.'cfg(any(unix, windows))'.dependencies]
ctrlc = { version = "3.5", features = ["termination"], optional = true }

# Explicit ProMotion opt-in on macOS: a CADisplayLink created from the winit
# window's NSView declares the 120Hz frame-rate demand (see
# platform/macos_display_link.rs). All of these are already in winit's own
# dependency graph.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
cookie = { version = "0.18", optional = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSAnimation",
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
objc2-core-graphics = { version = "0.3", optional = true, features = ["CGPath"] }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSHTTPCookie",
    "NSJSONSerialization",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSURLError",
    "NSURLRequest",
    "NSURLResponse",
] }
objc2-quartz-core = { version = "0.3", optional = true, features = [
    "CALayer",
    "CADisplayLink",
    "CAFrameRateRange",
    "CAMetalLayer",
    "CAShapeLayer",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKBackForwardList",
    "WKContentWorld",
    "WKFrameInfo",
    "WKSecurityOrigin",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web runner fetches its fonts while the GPU device comes up; `join!` and
# `join_all` are the whole of what it needs from futures.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }
js-sys = "0.3"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Response",
    "CompositionEvent",
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Node",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
# The renderer itself knows nothing about `Canvas`: it resolves to a
# `SceneView` before it reaches layout. The tests still author canvases, which
# is what keeps that resolution honest.
waterui-canvas = "0.2.0"
# The wayland examples need a widget theme; m3 is independently maintained.
hydrolysis-m3 = "0.3.0"
waterui-testing = "0.5.0"
waterui-navigation = "0.5.0"
# The presentation tests received from waterui exercise these component crates
# directly: live photos (media), the MCP session harness (mcp, aither-mcp,
# futures-lite, serde_json).
waterui-media = "0.5.0"
waterui-mcp = "0.5.0"
aither-mcp = { version = "0.4", default-features = false, features = ["server"] }
futures-lite = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
jiff = { version = "0.2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
waterui = { version = "0.5.0", default-features = false, features = ["flow-markdown", "gpu", "snackbar", "video-gpu"] }
base64 = "0.22"
executor-core = { version = "0.7.1", features = ["std", "async-executor"] }
tiny_http = "0.12"
# Two crates that only exist to let the segmentation test see what it asserts
# about: `icu_provider/logging` routes ICU4X data warnings through `log`
# instead of the `eprintln` shim debug builds get otherwise, and `tracing-log`
# bridges those records into the `tracing` subscriber the test captures. With
# `complex-scripts` on the parley dep, no warning may be emitted at all.
icu_provider = { version = "2.3", features = ["logging"] }
tracing-log = "0.2"

# `WKWebView` is `MainThreadOnly` and libtest runs tests on worker threads, so
# the macOS real-engine suite owns its `main` and pumps the main run loop.
[[test]]
name = "real_engine_macos"
harness = false
required-features = ["webview-system", "winit"]

[features]
default = []
accessibility = ["dep:accesskit"]
testing = []
inspector-signals = ["waterui/inspector-signals"]
# The platform's own web engine, bridged as a native subview. Every other engine
# is a crate the application links and installs; this backend never names one.
webview-system = [
    "dep:block2",
    "dep:cookie",
    "dep:futures",
    "dep:objc2-web-kit",
    "dep:serde_json",
]
winit = [
    "accessibility",
    "dep:winit",
    "dep:ui-events-winit",
    "dep:accesskit_winit",
    "dep:ctrlc",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
]
web = [
    "accessibility",
    "dep:futures",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[package.metadata.cargo-machete]
ignored = ["cfg_aliases", "shaderloom"]

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }

# `waterui-testing` depends on this backend at the 0.5.0-wave requirement
# `0.3.0`, which is this package; a registry copy would be pre-freeze code
# that no longer builds against the revision below. Drop the entry once
# hydrolysis 0.3.0 ships.
hydrolysis = { path = "." }

# The framework revision that lets `SceneContent` receive input
# (water-rs/waterui#1189), takes the executor's refresh rate from the host
# (water-rs/waterui#1201), carries `SubView::is_empty` — the §4.4
# membership answer this backend implements (water-rs/waterui#1209) — and
# defines the framework-owned `ListSelection` this backend renders
# (water-rs/waterui#1226). Every framework crate in the graph comes from
# the same revision so the graph holds one copy of each; drop these
# entries once a waterui release carries those changes. All waterui and
# waterkit crates are pinned by the migration block at the bottom of
# this table.

# The Material 3 theme must implement the five-argument
# `WidgetTheme::draw_button_chrome` contract added for
# water-rs/hydrolysis#115.
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "0f840d1263dce4a5fbd33559f308caff9d982105" }


# Migrated framework crates pinned to waterui's devin/chore/nami-snapshot
# branch head so the graph resolves a single nami Signal trait; waterkit
# rides the same-wave migration head for its VA-API gating.
nami = { git = "https://github.com/water-rs/nami", rev = "5dc2d92e4ee9a236afdf71aaf4ef5b26a6990425" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "5dc2d92e4ee9a236afdf71aaf4ef5b26a6990425" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "ac2c89453de8e23b4457fa8d432785791beabe66" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "ac2c89453de8e23b4457fa8d432785791beabe66" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "ac2c89453de8e23b4457fa8d432785791beabe66" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "ac2c89453de8e23b4457fa8d432785791beabe66" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "ac2c89453de8e23b4457fa8d432785791beabe66" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "ac2c89453de8e23b4457fa8d432785791beabe66" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "ac2c89453de8e23b4457fa8d432785791beabe66" }
